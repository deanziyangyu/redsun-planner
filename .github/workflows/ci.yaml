name: CI Pipeline

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint and type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"

      # the same hooks a contributor runs; a hook that rewrites a file fails the
      # run, so a fixable ruff violation still fails here
      - name: Run the commit hooks
        run: uv run --locked --only-group lint prek run --all-files --show-diff-on-failure

      - name: Type check
        run: uv run --locked --group dev mypy

      # verify the installed console script and the comparison path, not
      # only the importable test surface
      - name: Check the CLI entry point
        run: |
          uv run --locked planner --help
          uv run --locked planner compare --samples 10 --scenario measured --json > /dev/null

  tests:
    name: Tests ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --locked --group test

      - name: Run the tests
        run: uv run --locked --group test pytest -q

  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"

      - name: Build the sdist and wheel
        run: uv build

      - name: Store the distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
