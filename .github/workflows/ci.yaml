name: CI Pipeline

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint and type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"

      # the same hooks a contributor runs; a hook that rewrites a file fails the
      # run, so a fixable ruff violation still fails here
      - name: Run the commit hooks
        run: uv run --only-group lint prek run --all-files --show-diff-on-failure

      - name: Type check
        run: uv run --group dev mypy

  tests:
    name: Tests ${{ matrix.python-version }} / ${{ matrix.extras }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        extras: ["", "--extra registration"]
        include:
          - os: windows-latest
            python-version: "3.10"
            extras: ""
          - os: windows-latest
            python-version: "3.12"
            extras: "--extra registration"
          - os: macos-latest
            python-version: "3.10"
            extras: ""
          - os: macos-latest
            python-version: "3.12"
            extras: "--extra registration"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --group test ${{ matrix.extras }}

      - name: Run the tests
        run: uv run --group test ${{ matrix.extras }} pytest -q

  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"

      - name: Build the sdist and wheel
        run: uv build

      - name: Store the distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
